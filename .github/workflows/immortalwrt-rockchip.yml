name: immortalwrt-rockchip-master

on:
  repository_dispatch:
  workflow_dispatch:
  #schedule:
    #- cron: 0 17 * * *
  # watch:
  #   types: started

env:
  USER_NAME: shihairu22
  REPO_BRANCH: master
  CONFIG_FILE: configs/immortalwrt/immortalwrt.config
  DIY_SH: scripts/immortalwrt/immortalwrt.sh
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  Build:
    runs-on: self-hosted
    timeout-minutes: 420
    outputs:
      OPENWRTROOT: ${{ steps.update.outputs.OPENWRTROOT }}
      PLATFORM: ${{ steps.compile.outputs.PLATFORM }}
      TARGET: ${{ steps.compile.outputs.TARGET }}
      SUBTARGET: ${{ steps.compile.outputs.SUBTARGET }}
      FIRMWARE: ${{ steps.compile.outputs.FIRMWARE }}
      GENERATE_STATUS: ${{ steps.generate.outputs.GENERATE_STATUS }}

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        echo -e "Total CPU cores\t: $(nproc)"
        cat /proc/cpuinfo | grep 'model name'
        free -h
        uname -a
        [ -f /proc/version ] && cat /proc/version
        [ -f /etc/issue.net ] && cat /etc/issue.net
        [ -f /etc/issue ] && cat /etc/issue
        ulimit -a

    - name: Clone Source Code
      run: |
        df -hT $PWD
        # ── 抗抖动：家用链路对新建立的 TLS 连接有约 10% 的瞬时失败率（GnuTLS handshake failed），
        # 而全链路约有 40 处 git clone，不重试则几乎每轮都会静默丢包或整步失败，故对 clone 统一做有限重试。
        # 只清理「本轮克隆新建出来」的目录，绝不触碰重试前就已存在的路径。
        git() {
          if [ "${1:-}" != "clone" ]; then command git "$@"; return $?; fi
          local dest="${!#}" existed=0 n=0 rc=0
          case "$dest" in -*|http*|git@*|"") dest="" ;; esac
          if [ -n "$dest" ] && [ -e "$dest" ]; then existed=1; fi
          while :; do
            if command git "$@"; then
              return 0
            else
              rc=$?
            fi
            n=$((n + 1))
            if [ "$n" -ge 5 ]; then break; fi
            if [ -n "$dest" ] && [ "$existed" -eq 0 ] && [ -d "$dest" ]; then rm -rf -- "$dest"; fi
            echo "::warning::git clone 第 $n 次失败(rc=$rc)，5 秒后重试：${dest:-$*}" >&2
            sleep 5
          done
          return "$rc"
        }
        export -f git
        git clone https://github.com/$USER_NAME/immortalwrt -b $REPO_BRANCH openwrt
        # ── 共享 dl 缓存：实测 actions/checkout 的 clean 会执行 git clean -ffdx，把整个
        # openwrt/ 删掉（含 6.5G dl/ 与 67G build_dir/），所以下载缓存必须放到工作区外。
        # 这里把 openwrt/dl 软链到共享目录，两套构建复用同一份，每轮省约 30 分钟下载。
        # 注：不走 CONFIG_DOWNLOAD_FOLDER —— 实测 make defconfig 会把它重置为空。
        # build_dir 在工作区内、无法持久化，编译那 ~70 分钟每轮仍要重来。
        mkdir -p /home/ghrunner/dl-cache
        [ -e openwrt/dl ] || ln -s /home/ghrunner/dl-cache openwrt/dl
        ls -ld openwrt/dl

    - name: Update Feeds
      id: update
      run: |
        cd openwrt
        echo "OPENWRTROOT=$PWD" >> $GITHUB_ENV
        echo "OPENWRTROOT=$PWD" >> $GITHUB_OUTPUT
        # 同上：克隆统一走带重试的 git 包装
        # ── 抗抖动：家用链路对新建立的 TLS 连接有约 10% 的瞬时失败率（GnuTLS handshake failed），
        # 而全链路约有 40 处 git clone，不重试则几乎每轮都会静默丢包或整步失败，故对 clone 统一做有限重试。
        # 只清理「本轮克隆新建出来」的目录，绝不触碰重试前就已存在的路径。
        git() {
          if [ "${1:-}" != "clone" ]; then command git "$@"; return $?; fi
          local dest="${!#}" existed=0 n=0 rc=0
          case "$dest" in -*|http*|git@*|"") dest="" ;; esac
          if [ -n "$dest" ] && [ -e "$dest" ]; then existed=1; fi
          while :; do
            if command git "$@"; then
              return 0
            else
              rc=$?
            fi
            n=$((n + 1))
            if [ "$n" -ge 5 ]; then break; fi
            if [ -n "$dest" ] && [ "$existed" -eq 0 ] && [ -d "$dest" ]; then rm -rf -- "$dest"; fi
            echo "::warning::git clone 第 $n 次失败(rc=$rc)，5 秒后重试：${dest:-$*}" >&2
            sleep 5
          done
          return "$rc"
        }
        export -f git
        mkdir customfeeds
        git clone --depth=1 https://github.com/$USER_NAME/openwrt-package customfeeds/lovepackages
        git clone --depth=1 https://github.com/$USER_NAME/rely customfeeds/loverely
        git clone --depth=1 https://github.com/$USER_NAME/packages -b $REPO_BRANCH customfeeds/packages
        git clone --depth=1 https://github.com/$USER_NAME/luci -b $REPO_BRANCH customfeeds/luci
        git clone --depth=1 https://github.com/openwrt/routing -b $REPO_BRANCH customfeeds/routing
        git clone --depth=1 https://github.com/openwrt/telephony -b $REPO_BRANCH customfeeds/telephony
        echo "::group::Executing package hook scripts"
        find ../scripts -type f -name "*.sh" -exec chmod +x {} +
        ../scripts/immortalwrt/hook-package.sh
        ../scripts/immortalwrt/hook-base.sh
        echo "::endgroup::"
        ../scripts/immortalwrt/hook-feeds.sh

    - name: Install Feeds
      run: |
        cd $OPENWRTROOT
        # feeds 是 perl 脚本、内部自己调 git clone，shell 函数覆盖不到，故整步重试
        ok=0
        for i in 1 2 3 4 5; do
          if ./scripts/feeds install -a; then ok=1; break; fi
          echo "::warning::feeds install 第 $i 次失败，10 秒后重试"
          sleep 10
        done
        if [ "$ok" -ne 1 ]; then echo "::error::feeds install 连续 5 次失败"; exit 1; fi

    - name: Load Custom Configuration
      env:
        CNSPEEDTEST_TOKEN: ${{ secrets.CNSPEEDTEST_TOKEN }}
      run: |
        [ -e files ] && mv files $OPENWRTROOT/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE $OPENWRTROOT/.config
        cd $OPENWRTROOT
        ../$DIY_SH
        ../scripts/preset-clash-core.sh arm64
        ../scripts/preset-nikki-core.sh
        ../scripts/preset-terminal-tools.sh
        # ── 收敛 .config：kconfig 从「稀疏配置」起步时会把一部分明确 =y 的符号解析成 n
        # （实测 rockchip 的 DRM 家族整族被丢，固件里既没显示驱动也不报错）。
        # 先存一份「要求开启」的快照，再由脚本反复贴回 + defconfig 直到解析结果稳定。
        cp -f .config .config.requested
        echo "::group::View 'make defconfig' output（含收敛，最多 3 轮）"
        bash ../scripts/immortalwrt/cfg-converge.sh .config.requested . 3
        echo "::endgroup::"

    - name: Download Package
      id: package
      run: |
        cd $OPENWRTROOT
        cat .config
        make download -j$(nproc)
        echo "dl 实际路径: $(readlink -f dl)  文件数 $(ls -1 dl 2>/dev/null | wc -l)"
        # ── 注意：dl 是软链时，`find dl -size -1024c` 会把「软链本身」当成一个 <1024 字节的
        # 文件（软链大小 = 目标路径长度），随后被 -exec rm -f 删掉 —— 共享缓存从这一刻起失效，
        # 编译阶段的所有下载都落到工作区内的实体 dl/，每轮重下。故先判类型：
        # 软链 → 用 -L 只清目标目录里的坏文件，绝不删软链本身。
        if [ -L dl ]; then
          echo "dl 是软链 -> $(readlink dl)（清理目标目录内的坏文件，不删软链本身）"
          find -L dl -maxdepth 1 -size -1024c -exec ls -l {} \; || true
          find -L dl -maxdepth 1 -size -1024c -exec rm -f {} \; || true
        else
          find dl -size -1024c -exec ls -l {} \; || true
          find dl -size -1024c -exec rm -f {} \; || true
        fi
        ls -ld dl

    - name: Compile Packages
      id: compile
      run: |
        cd $OPENWRTROOT
        export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        # ── 串行锁：本机只有 16 vCPU / 24.5G 内存，两个构建同时编译会互相拖慢并逼近内存护栏，
        # 故与 x86 流水线共用同一把锁（/home/ghrunner/locks/build.lock），后到者排队等待。
        # flock 随本步骤的 shell 存活而持有，步骤结束自动释放。
        mkdir -p /home/ghrunner/locks
        exec 9>/home/ghrunner/locks/build.lock
        if ! flock -w 7200 9; then echo "::error::等待编译锁超时（2 小时）"; exit 1; fi
        echo "已取得编译锁（另一仓库若有构建在跑，会在这里排队）"
        echo -e "$(nproc) thread compile"
        make tools/compile -j$(nproc) || make tools/compile -j$(nproc) || make tools/compile -j1 IGNORE_ERRORS=1 V=s
        make toolchain/compile -j$(nproc) || make toolchain/compile -j$(nproc) || make toolchain/compile -j1 IGNORE_ERRORS=1 V=s
        make target/compile -j$(nproc) || make target/compile -j$(nproc) IGNORE_ERRORS=1 || make target/compile -j1 IGNORE_ERRORS=1 V=s
        make diffconfig
        # 第一次失败后，重试那次加上 V=s：否则真实报错（例如 kmod 打包检查的
        # "missing dependencies for the following libraries: fb.ko"）会被 IGNORE_ERRORS
        # 和非 verbose 一起吞掉，只剩一句聚合的 "package/kernel/linux failed to build"。
        # 重试是增量的（第一次已编完大部分包），verbose 输出量可控。
        make package/compile -j$(nproc) IGNORE_ERRORS=1 || make package/compile -j$(nproc) IGNORE_ERRORS=1 V=s
        make package/index
        cd $OPENWRTROOT/bin/packages/*
        PLATFORM=$(basename `pwd`)
        echo "PLATFORM=$PLATFORM" >> $GITHUB_ENV
        echo "PLATFORM=$PLATFORM" >> $GITHUB_OUTPUT
        cd $OPENWRTROOT/bin/targets/*
        TARGET=$(basename `pwd`)
        echo "TARGET=$TARGET" >> $GITHUB_ENV
        echo "TARGET=$TARGET" >> $GITHUB_OUTPUT
        cd *
        SUBTARGET=$(basename `pwd`)
        echo "SUBTARGET=$SUBTARGET" >> $GITHUB_ENV
        echo "SUBTARGET=$SUBTARGET" >> $GITHUB_OUTPUT
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "FIRMWARE=$PWD" >> $GITHUB_OUTPUT
        echo "COMPILE_STATUS=success" >> $GITHUB_OUTPUT

    - name: Generate Firmware
      if: steps.compile.outputs.COMPILE_STATUS == 'success'
      id: generate
      run: |
        cd $OPENWRTROOT
        export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        mkdir -p files/etc/uci-defaults/
        cp ../scripts/immortalwrt/snapshots-init-settings.sh files/etc/uci-defaults/99-init-settings
        mkdir -p files/etc/apk/repositories.d 
        cp ../configs/apk/openwrt-repositories-snapshots.conf files/etc/apk/repositories
        cp ../configs/apk/openwrt-repositories-snapshots.conf files/etc/apk/repositories.d/distfeeds.list
        make package/install -j$(nproc) || make package/install -j1 V=s
        make target/install -j$(nproc) || make target/install -j1 V=s
        pushd bin/targets/rockchip/armv8
        rm -rf *ext4* *.manifest packages *.json *.buildinfo
        popd
        make checksum
        echo "GENERATE_STATUS=success" >> $GITHUB_OUTPUT

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
          echo "release_tag=$(date +"%Y.%m.%d")-immortalwrt" >> $GITHUB_OUTPUT
          echo "release_date=$(date "+%Y年%m月%d日")" >> $GITHUB_OUTPUT
          KERNEL_VERSION=$(cat $OPENWRTROOT/build_dir/target-*/linux-*/linux-*/include/config/kernel.release)
          echo "release_kernel=$KERNEL_VERSION" >> $GITHUB_OUTPUT
          touch release.txt
          echo -e "**📥固件说明**: \n" >> release.txt
          echo -e "#### 后台地址: \`192.168.11.1\`\n" >> release.txt
          echo -e "#### 后台密码: \`password\`\n" >> release.txt
          echo -e "#### Linux Kernel: **$KERNEL_VERSION**\n" >> release.txt
          echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      # 上传策略：受控 6 路并发 + 逐文件重试（直连优先、失败退代理）。
      # 实测 2026-10-09（runner 在用户家中，家宽上行约 100Mbps）：
      #   直连单流 190MB → 8.56 MB/s；走 NAS 代理单流 95MB → 8.07 MB/s
      #   （代理并不慢，旧注释里「代理只有 0.04 MB/s」已过时）；
      #   直连 4 并发合计 7.4 MB/s、8 并发合计 10.0 MB/s
      #   ⇒ 天花板是家宽上行（8–10 MB/s），并发不能无脑加。
      # 反面教材：原来一次性并发上传 24 个文件，单流被摊薄到 0.3 MB/s，
      #   触发 GitHub「Upload body timed out due to inactivity」(09:10:15)，
      #   3 个文件成了空壳（nanopi-r2c / nanopi-r4se / orangepi-5），另一个
      #   （nanopi-r2s）一路卡到 09:35:42：整步 28 分 31 秒，其中约 19.5 分钟在干等。
      # 6 路并发下 6.12 GiB 预计 13–15 分钟（上行理论下限约 12.8 分钟）。
      # continue-on-error：个别文件仍失败不把整步判死，交给下一步按大小+state 复核补传。
      continue-on-error: true
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          http_proxy: ""
          https_proxy: ""
          no_proxy: "*"
          TAG: ${{ steps.tag.outputs.release_tag }}
          TITLE: ${{ steps.tag.outputs.release_date }} immortalwrt
          FIRMWARE: ${{ env.FIRMWARE }}
      run: |
          set -u
          REPO="${GITHUB_REPOSITORY}"
          DIR="$FIRMWARE"
          gdirect() { env -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u all_proxy no_proxy='*' NO_PROXY='*' gh "$@"; }
          gproxy()  { http_proxy=http://10.0.0.221:7890 https_proxy=http://10.0.0.221:7890 no_proxy='10.0.0.0/8,127.0.0.1,localhost,::1' gh "$@"; }

          echo "待上传：$(ls -1 "$DIR" | wc -l) 个文件（$DIR）"

          # 建 draft release：中途失败不会留下公开的半成品，复核全齐后再转正
          if ! gdirect release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gdirect release create "$TAG" -R "$REPO" --draft --title "$TITLE" --notes-file release.txt \
              || gproxy release create "$TAG" -R "$REPO" --draft --title "$TITLE" --notes-file release.txt \
              || { echo "::error::建 draft release 失败"; exit 1; }
          fi

          # 单文件上传：直连/代理交替，最多 6 次
          upload_one() {
            local f="$1" a
            for a in 1 2 3 4 5 6; do
              if [ $((a % 2)) -eq 1 ]; then
                gdirect release upload "$TAG" "$f" -R "$REPO" --clobber && return 0
              else
                gproxy release upload "$TAG" "$f" -R "$REPO" --clobber && return 0
              fi
              echo "  第 $a 次失败：$(basename "$f")"; sleep 5
            done
            echo "::warning::$(basename "$f") 上传失败（交给复核步骤补传）"
            return 1
          }

          # 并发池：最多 6 个同时在传（实测 24 并发把单流摊薄到 0.3 MB/s 并触发超时）
          MAXP=6
          for f in "$DIR"/*; do
            [ -f "$f" ] || continue
            while [ "$(jobs -rp | wc -l)" -ge "$MAXP" ]; do wait -n 2>/dev/null || sleep 1; done
            upload_one "$f" &
          done
          wait
          echo "上传阶段结束（失败项由下一步按大小+state 复核补传）"

    - name: Verify and finish release upload
      # 兜底：逐文件比对远端资产名，缺的用 gh 重试补齐，全齐后才转正 release。
      # 避免「传了 21/24 却整步失败、release 卡在 draft」。
      if: always() && steps.tag.outputs.status == 'success' && !cancelled()
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
          set -u
          TMPD=$(mktemp -d -p "${RUNNER_TEMP:-/tmp}")   # 私有临时目录：绝不用固定的 /tmp/xxx（sticky bit 下会被别人的同名文件挡住）；基目录优先 RUNNER_TEMP，防 TMPDIR 被带偏到不可写处
          TAG="${{ steps.tag.outputs.release_tag }}"
          REPO="${{ github.repository }}"
          DIR="${{ env.FIRMWARE }}"
          # 直连优先（快约 200 倍），失败回退代理
          gdirect() { env -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u all_proxy no_proxy='*' NO_PROXY='*' gh "$@"; }
          gproxy()  { http_proxy=http://10.0.0.221:7890 https_proxy=http://10.0.0.221:7890 no_proxy='10.0.0.0/8,127.0.0.1,localhost,::1' gh "$@"; }

          RID=$(gdirect api "repos/$REPO/releases/tags/$TAG" --jq .id 2>/dev/null) \
            || RID=$(gproxy api "repos/$REPO/releases/tags/$TAG" --jq .id 2>/dev/null) \
            || { echo "::error::取不到 release id，中止"; exit 1; }
          echo "release id=$RID"

          # 资产清单必须连「大小 + state」一起取：只比名字会被「记录已建、body 没传完」的
          # 空壳骗过 —— 实测 3 个文件 body 超时后记录仍在 ⇒ 复核算成「已有」⇒ 空壳随后被
          # GitHub 回收 ⇒ 最终少 3 个资产，而 release 却显示「转正成功」。
          fetch_assets() {
            gdirect api "repos/$REPO/releases/$RID/assets?per_page=100" --jq '.[] | "\(.name)\t\(.size)\t\(.state)"' > "$1" \
              || gproxy api "repos/$REPO/releases/$RID/assets?per_page=100" --jq '.[] | "\(.name)\t\(.size)\t\(.state)"' > "$1" \
              || { echo "::error::资产列表取不到，中止"; exit 1; }
          }
          # 本地应有清单：名字<TAB>字节数（跳过目录）
          ( cd "$DIR" && for f in *; do [ -f "$f" ] && printf '%s\t%s\n' "$f" "$(stat -c%s "$f")"; done ) > $TMPD/want.txt
          fetch_assets $TMPD/have.txt
          # 缺 / 大小不符 / state 不是 uploaded 的，一律算「需补传」
          awk -F'\t' 'NR==FNR { ok[$1] = ($3=="uploaded" ? $2 : "BAD"); next }
                      { if (!($1 in ok) || ok[$1] != $2) print $1 }' \
            $TMPD/have.txt $TMPD/want.txt > $TMPD/miss.txt
          echo "应有 $(wc -l < $TMPD/want.txt) 个 / 远端记录 $(wc -l < $TMPD/have.txt) 条 / 需补传 $(wc -l < $TMPD/miss.txt) 个"

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            ok=0
            for a in 1 2 3 4; do
              if [ $((a % 2)) -eq 1 ]; then
                gdirect release upload "$TAG" "$DIR/$f" -R "$REPO" --clobber && { ok=1; break; }
              else
                gproxy release upload "$TAG" "$DIR/$f" -R "$REPO" --clobber && { ok=1; break; }
              fi
              echo "  第 $a 次失败：$f"
            done
            [ $ok -eq 0 ] && echo "::warning::$f 补传失败"
          done < $TMPD/miss.txt

          # 复核：全齐（且大小 / state 都对）才转正
          fetch_assets $TMPD/have2.txt
          awk -F'\t' 'NR==FNR { ok[$1] = ($3=="uploaded" ? $2 : "BAD"); next }
                      { if (!($1 in ok) || ok[$1] != $2) print $1 }' \
            $TMPD/have2.txt $TMPD/want.txt > $TMPD/miss2.txt
          if [ -s $TMPD/miss2.txt ]; then
            echo "::error::仍缺 $(wc -l < $TMPD/miss2.txt) 个资产，不转正："
            cat $TMPD/miss2.txt
            exit 1
          fi
          gdirect release edit "$TAG" -R "$REPO" --draft=false --latest \
            || gproxy release edit "$TAG" -R "$REPO" --draft=false --latest
          echo "✅ $(wc -l < $TMPD/have2.txt) 个资产齐全，release 已转正"

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
          retain_days: 5
          keep_minimum_runs: 5

    - name: Remove old Releases
      uses: ophub/delete-releases-workflows@main
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
          delete_releases: true
          releases_keep_latest: 480
          delete_tags: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Delete Artifacts
      uses: geekyeggo/delete-artifact@main
      with:
         name: |
            bin-archive

    - name: Clean workspace (free disk)
      # 每轮编译会在工作区留下 ~90G：build_dir 64G + staging_dir 5G + bin 6.5G + tmp 6G。
      # 产物已经进了 release，这里收尾清掉，免得磁盘被逐轮吃满（实测两轮就吃掉 156G）。
      # 注意 dl 是软链，不带尾斜杠的 rm -rf 只删链接、不碰共享缓存 dl-cache。
      if: always()
      run: |
          set -u
          for D in "$GITHUB_WORKSPACE"/openwrt openwrt; do
            [ -d "$D" ] || continue
            echo "清理 $D  大小 $(du -sh "$D" 2>/dev/null | cut -f1)"
            rm -rf -- "$D"
          done
          echo "剩余空间："; df -h "$GITHUB_WORKSPACE" | tail -1
